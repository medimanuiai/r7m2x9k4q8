name: Prompt-05 Typed Domain Models

on:
  push:
    branches: [ main, pilot, '**/pilot-updates-*' ]
  pull_request:
    branches: [ main, pilot ]

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  validate:
    name: Python validation
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up project Python
        uses: actions/setup-python@v4
        with:
          python-version-file: '.python-version'
          cache: pip
          cache-dependency-path: systems/Parasara/Documentation/Engine/Prompt-01/WorkPackage/Reports/WP00/requirements-stage01.lock.txt
      - name: Print resolved Python version
        run: python -c "import sys; print(sys.version)"
      - name: Install locked Stage-01 dependencies
        run: |
          python -m pip install --disable-pip-version-check -r systems/Parasara/Documentation/Engine/Prompt-01/WorkPackage/Reports/WP00/requirements-stage01.lock.txt
          python -m pip install --disable-pip-version-check --no-deps -e systems/SuryaSiddhanta
      - name: Run preserved Prompt-03 required gate
        run: python tools/validate_prompt03.py full
      - name: Run authoritative Prompt-05 validation
        run: python tools/validate_prompt05.py full

  required:
    name: Prompt-05 required aggregate
    runs-on: windows-latest
    needs: validate
    if: always()
    steps:
      - name: Require Python validation
        env:
          VALIDATION_RESULT: ${{ needs.validate.result }}
        run: |
          if ($env:VALIDATION_RESULT -ne 'success') {
            throw 'Required Prompt-05 Python validation must succeed.'
          }
